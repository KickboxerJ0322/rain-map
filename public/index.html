<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Rain Map</title>
    <link rel="icon" type="image/png" href="/rain-map_logo.png">
    <link rel="stylesheet" href="/style.css">
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand-block">
          <img class="brand-logo" src="/rain-map_logo.png" alt="Rain Map logo">
          <div class="brand-copy">
            <h1>Rain Map</h1>
          </div>
        </div>
        <button id="locationButton" class="ghost-button" type="button">現在地へ</button>
      </header>

      <main class="layout">
        <section class="map-card">
          <div id="map" aria-label="Rain cloud map"></div>

          <div class="legend-dock">
            <div class="legend-switcher" role="group" aria-label="凡例切り替え">
              <button class="ghost-button tiny legend-tab" data-legend="rain" type="button">雨雲</button>
              <button class="ghost-button tiny legend-tab" data-legend="thunder" type="button">雷</button>
              <button class="ghost-button tiny legend-tab" data-legend="tornado" type="button">竜巻</button>
            </div>

            <div id="legendPanel" class="map-legend is-hidden" aria-live="polite">
              <div class="map-legend-head">
                <strong id="legendTitle">雨雲レイヤー</strong>
                <button id="legendCloseButton" class="ghost-button tiny" type="button">閉じる</button>
              </div>
              <div id="legendBody" class="map-legend-body"></div>
            </div>
          </div>

          <div class="map-badge" id="statusBadge">読み込み中...</div>
        </section>

        <aside class="control-card">
          <div class="panel">
            <div class="panel-head">
              <h2>表示設定</h2>
            </div>

            <div class="toggle-stack">
              <label class="toggle">
                <input id="rainToggle" type="checkbox" checked>
                <span>雨雲レイヤー</span>
              </label>
              <label class="toggle">
                <input id="thunderToggle" type="checkbox">
                <span>雷レイヤー</span>
              </label>
              <label class="toggle">
                <input id="tornadoToggle" type="checkbox">
                <span>竜巻レイヤー</span>
              </label>
            </div>

            <label class="field">
              <span>透明度: <strong id="opacityValue">75%</strong></span>
              <input id="opacitySlider" type="range" min="0" max="100" step="5" value="75">
            </label>

            <label class="field">
              <span>再生速度: <strong id="speedValue">1000ms</strong></span>
              <input id="speedSlider" type="range" min="300" max="2000" step="100" value="1000">
            </label>

            <div class="meta-grid">
              <div>
                <span class="meta-label">基準時刻</span>
                <strong id="baseTimeValue">-</strong>
              </div>
              <div>
                <span class="meta-label">表示時刻</span>
                <strong id="validTimeValue">-</strong>
              </div>
            </div>
          </div>

          <div class="panel">
            <div class="panel-head">
              <h2>タイムスライダー</h2>
              <button id="refreshButton" class="ghost-button small" type="button">最新化</button>
            </div>

            <div class="timeline">
              <button id="playButton" class="primary-button" type="button">再生</button>
              <input id="timeSlider" type="range" min="0" max="12" step="1" value="0">
            </div>
            <div id="timelineLabels" class="timeline-labels" aria-hidden="true"></div>
          </div>

          <div class="panel">
            <h2>使い方</h2>
            <ul class="notes">
              <li>気象庁の「雨雲の動き」「雷活動度」「竜巻発生確度」を Google Maps 上に重ねて表示します。</li>
              <li>雨雲を基準に、実況から +60 分までを 5 分刻みで切り替えます。</li>
              <li>雷と竜巻は 10 分更新のため、近い時刻のデータを同じタイムライン上で表示します。</li>
            </ul>
          </div>
        </aside>
      </main>
    </div>

    <script src="/config.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
